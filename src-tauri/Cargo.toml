[package]
name = "aictionary-re"
version = "3.3.0"
description = "A desktop dictionary with offline lookups and audio pronunciation"
authors = ["ahpxex <AHpx@yandex.com>"]
license = "MIT"
repository = "https://github.com/ahpxex/Aictionary"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aictionary_re_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS is picked per platform below: the system stack on desktop, rustls on
# mobile, where no OpenSSL is available to link against.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
# Edge's read-aloud protocol is spoken directly in src/edge_tts.rs rather than
# through msedge-tts. That crate verifies TLS with rustls-platform-verifier,
# which on Android needs a JNI handshake and a Kotlin AAR on the classpath -
# and the dependency graph pulled in two incompatible versions of it at once,
# so no single AAR could satisfy both. Speaking the protocol ourselves keeps
# one code path on every platform and puts the proxy under our control.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tokio-socks = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
# Bundled Mozilla roots, so certificate verification is identical on every
# target and never reaches for a platform trust store.
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Desktop-only surface. Tray icons, global shortcuts, autostart and
# single-instance handling are window-manager concepts with no Android/iOS
# counterpart, and the MCP bridge is a dev tool that binds a local socket.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", features = ["default-tls", "macos-system-configuration"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# In-app updates: check + download + install; process gives the relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Dev-only automation bridge; only initialized under cfg(debug_assertions).
tauri-plugin-mcp-bridge = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
# Reading the system proxy pane. Already in the tree via reqwest's
# macos-system-configuration feature, so this costs no extra build.
system-configuration = "0.7"

# `default-features = false` matters here: reqwest's default set includes
# `default-tls`, which links native-tls against an OpenSSL that does not exist
# on Android. `system-proxy` is kept because the app relies on it everywhere.
#
# The `-no-provider` spelling is load-bearing too. The plain `rustls-tls`
# feature pins a CryptoProvider of its own, and once two of them are linked
# rustls 0.23 refuses to choose and panics the moment a ClientConfig is built -
# inside a tokio worker, where it surfaces as a command that never resolves and
# a spinner that never stops. Leaving it unpinned keeps the single provider the
# shared `rustls` dependency selects, which run() then installs by name.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "system-proxy",
] }

[dev-dependencies]
tempfile = "3"
