[package]
name = "aictionary-re"
version = "3.0.0"
description = "A desktop dictionary with offline lookups and audio pronunciation"
authors = ["ahpxex <AHpx@yandex.com>"]
license = "MIT"
repository = "https://github.com/ahpxex/Aictionary"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aictionary_re_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS is picked per platform below: the system stack on desktop, rustls on
# mobile, where no OpenSSL is available to link against.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
msedge-tts = { version = "0.4.0", features = ["tokio-runtime"] }

# Desktop-only surface. Tray icons, global shortcuts, autostart and
# single-instance handling are window-manager concepts with no Android/iOS
# counterpart, and the MCP bridge is a dev tool that binds a local socket.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", features = ["default-tls", "macos-system-configuration"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Dev-only automation bridge; only initialized under cfg(debug_assertions).
tauri-plugin-mcp-bridge = "0.12"

# `default-features = false` matters here: reqwest's default set includes
# `default-tls`, which links native-tls against an OpenSSL that does not exist
# on Android. `system-proxy` is kept because the app relies on it everywhere.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tempfile = "3"
