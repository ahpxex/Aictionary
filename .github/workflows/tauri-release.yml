name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macos
            arch: arm64
            build_args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - os: macos-latest
            os_name: macos
            arch: x86_64
            build_args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - os: ubuntu-22.04
            os_name: linux
            arch: x86_64
            build_args: ""
            rust_target: ""
          - os: windows-latest
            os_name: windows
            arch: x86_64
            build_args: ""
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Windows dependencies (WiX + NSIS)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset nsis --no-progress -y

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # A Developer ID signature plus a notarization ticket is what lets
      # Gatekeeper open the app without the "unidentified developer" wall.
      # The bundler imports APPLE_CERTIFICATE into a throwaway keychain and
      # notarizes with the App Store Connect API key on its own; the only
      # thing it cannot do is materialize the .p8 from a secret, so that is
      # written here. Missing secrets would silently yield an ad-hoc build
      # that nobody can open, so fail loudly instead.
      - name: Prepare macOS signing credentials
        if: matrix.os_name == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_API_KEY_P8 APPLE_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not set; refusing to ship an unsigned macOS build." >&2
              exit 1
            fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Tauri app
        env:
          # Signs the updater artifacts (.app.tar.gz / .msi / .AppImage + .sig)
          # so installed apps can verify what they download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun tauri build ${{ matrix.build_args }}

      # The bundler notarizes and staples the .app but only signs the DMG
      # around it, and Gatekeeper assesses the disk image on open before it
      # ever looks at the app inside. The app is already notarized, so this
      # second submission is quick.
      - name: Notarize macOS disk image
        if: matrix.os_name == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          DMG=$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"

      # Gatekeeper's own verdict on the bundle and the disk image, so a build
      # that was signed but not notarized (or notarized but not stapled)
      # cannot reach the release page.
      - name: Verify macOS signature and notarization
        if: matrix.os_name == 'macos'
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -n 1)
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec --verbose=2 "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Clean up macOS signing credentials
        if: always() && matrix.os_name == 'macos'
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Collect and rename artifact
        run: |
          set -euo pipefail

          # For cross-compiled targets (like macOS arm64/x86_64) Cargo places
          # artifacts under target/<triple>/release. For native targets (Linux/Windows),
          # the path is target/release. Use matrix.rust_target when present.
          if [ -n "${{ matrix.rust_target }}" ]; then
            ART_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          else
            ART_DIR="src-tauri/target/release/bundle"
          fi

          case "${{ matrix.os_name }}" in
            macos)
              EXT="dmg"
              ART=$(find "$ART_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n 1 || true)
              ;;
            windows)
              ART=$(find "$ART_DIR/msi" -maxdepth 1 -name '*.msi' | head -n 1 || true)
              if [ -n "${ART:-}" ]; then
                EXT="msi"
              else
                ART=$(find "$ART_DIR/nsis" -maxdepth 1 -name '*.exe' | head -n 1 || true)
                EXT="exe"
              fi
              ;;
            linux)
              EXT="AppImage"
              ART=$(find "$ART_DIR/appimage" -maxdepth 1 -name '*.AppImage' | head -n 1 || true)
              ;;
          esac

          if [ -z "${ART:-}" ]; then
            echo "Failed to find artifact in $ART_DIR" >&2
            ls -R "$ART_DIR" || true
            exit 1
          fi

          mkdir -p release
          DEST="release/Aictionary-${GITHUB_REF_NAME}_${{ matrix.os_name }}_${{ matrix.arch }}.${EXT}"
          cp "$ART" "$DEST"

          # Updater artifacts. On Linux and Windows the installer artifact
          # doubles as the update package, so only its .sig rides along under
          # the renamed name; macOS updates from a separate .app.tar.gz.
          BASE="release/Aictionary-${GITHUB_REF_NAME}_${{ matrix.os_name }}_${{ matrix.arch }}"
          case "${{ matrix.os_name }}" in
            macos)
              UPD=$(find "$ART_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n 1 || true)
              if [ -n "${UPD:-}" ] && [ -f "$UPD.sig" ]; then
                cp "$UPD" "$BASE.app.tar.gz"
                cp "$UPD.sig" "$BASE.app.tar.gz.sig"
              fi
              ;;
            windows|linux)
              if [ -f "$ART.sig" ]; then
                cp "$ART.sig" "$DEST.sig"
              fi
              ;;
          esac

          if [ "${{ matrix.os_name }}" == "windows" ]; then
            BIN_PATH="src-tauri/target/release/aictionary-re.exe"
            if [ -f "$BIN_PATH" ]; then
              ZIP_DEST="release/Aictionary-${GITHUB_REF_NAME}_windows_${{ matrix.arch }}_portable.zip"
              cp "$BIN_PATH" "Aictionary.exe"
              powershell -Command "Compress-Archive -Path 'Aictionary.exe' -DestinationPath '$ZIP_DEST'"
              rm "Aictionary.exe"
            fi
          fi

          echo "RENAMED_ARTIFACT=release/*" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aictionary-${{ github.ref_name }}_${{ matrix.os_name }}_${{ matrix.arch }}
          path: ${{ env.RENAMED_ARTIFACT }}

  android:
    name: Build android universal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      # Gradle 8.14.3 does not run on JDK 25; 21 is the newest it accepts.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The keystore is the app's identity: an APK signed with a different key
      # cannot be installed over an existing one. Without these secrets the
      # build would silently produce an unsigned APK that nobody can install,
      # so fail loudly instead.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; cannot produce an installable APK." >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: bun tauri android build --apk

      - name: Collect and rename artifact
        run: |
          set -euo pipefail
          ART=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release \
            -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n 1 || true)

          if [ -z "${ART:-}" ]; then
            echo "No signed APK produced" >&2
            find src-tauri/gen/android/app/build/outputs/apk -type f || true
            exit 1
          fi

          mkdir -p release
          cp "$ART" "release/Aictionary-${GITHUB_REF_NAME}_android_universal.apk"

      # key.properties points at a keystore in the runner temp dir; drop both so
      # nothing signing-related can be picked up by a later step.
      - name: Clean up signing material
        if: always()
        run: rm -f src-tauri/gen/android/key.properties "$RUNNER_TEMP/android-release.jks"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aictionary-${{ github.ref_name }}_android_universal
          path: release/*

  release:
    name: Create GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate updater manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # latest.json is what installed apps poll: per-platform download
          # URL plus the minisign signature of that artifact. Signatures are
          # embedded here, so the bare .sig files stay out of the release.
          python3 - <<'EOF'
          import datetime
          import json
          import os

          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/"
          artifacts = {
              "darwin-aarch64": f"Aictionary-{tag}_macos_arm64.app.tar.gz",
              "darwin-x86_64": f"Aictionary-{tag}_macos_x86_64.app.tar.gz",
              "linux-x86_64": f"Aictionary-{tag}_linux_x86_64.AppImage",
              "windows-x86_64": f"Aictionary-{tag}_windows_x86_64.msi",
          }

          platforms = {}
          for platform, name in artifacts.items():
              if not (os.path.exists(f"dist/{name}") and os.path.exists(f"dist/{name}.sig")):
                  print(f"skipping {platform}: {name}(.sig) missing")
                  continue
              with open(f"dist/{name}.sig") as f:
                  platforms[platform] = {"signature": f.read(), "url": base + name}

          manifest = {
              "version": tag.lstrip("v"),
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("dist/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps({p: v["url"] for p, v in platforms.items()}, indent=2))
          EOF
          rm -f dist/*.sig

      - name: Generate Release Body
        run: |
          echo "### Downloads" > release_body.md
          echo "" >> release_body.md
          echo "| File |" >> release_body.md
          echo "| :--- |" >> release_body.md
          for file in dist/*; do
            filename=$(basename "$file")
            # Updater-only assets stay downloadable but out of the table.
            case "$filename" in
              latest.json|*.app.tar.gz) continue ;;
            esac
            echo "| [$filename](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$filename) |" >> release_body.md
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aictionary ${{ github.ref_name }}"
          body_path: release_body.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
